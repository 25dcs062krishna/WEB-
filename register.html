<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Register</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

    <header>
        <h1>STUDENTHUB PORTAL</h1>
        <p>Create your student account</p>
    </header>

    <main>

        <section class="register-box">

            <div class="form-heading">

                <h2>Create Your Account</h2>

                <p>
                    Fill in your details to register for StudentHub.
                </p>

            </div>

            <form method="POST" action="register.php">

                <div class="form-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="student-id">
                        Student ID
                    </label>

                    <input
                        type="text"
                        id="student-id"
                        name="student-id"
                        placeholder="Enter your student ID"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <select id="course" name="course" required>

                        <option value="">
                            Select Course
                        </option>

                        <option value="cse">
                            Computer Science and Engineering
                        </option>

                        <option value="it">
                            Information Technology
                        </option>

                        <option value="ece">
                            Electronics and Communication Engineering
                        </option>

                        <option value="me">
                            Mechanical Engineering
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="semester">
                        Semester
                    </label>

                    <select id="semester" name="semester" required>

                        <option value="">
                            Select Semester
                        </option>

                        <option value="1">1st Semester</option>
                        <option value="2">2nd Semester</option>
                        <option value="3">3rd Semester</option>
                        <option value="4">4th Semester</option>
                        <option value="5">5th Semester</option>
                        <option value="6">6th Semester</option>
                        <option value="7">7th Semester</option>
                        <option value="8">8th Semester</option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="dob">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dob"
                        name="dob"
                        required
                    >

                </div>

                <div class="form-group gender-group">

                    <label>
                        Gender
                    </label>

                    <div class="gender-options">

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="male"
                                required
                            >
                            Male
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="female"
                            >
                            Female
                        </label>

                        <label>
                            <input
                                type="radio"
                                name="gender"
                                value="other"
                            >
                            Other
                        </label>

                    </div>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            name="terms"
                            required
                        >

                        I agree to the Terms and Conditions

                    </label>

                </div>

                <button
                    type="submit"
                    class="create-btn"
                >
                    CREATE ACCOUNT
                </button>

            </form>

            <p class="login-text">

                Already registered?

                <a href="login.html">
                    Login
                </a>

            </p>

        </section>

        <div class="back-home">

            <a href="index.html">
                ← Back to Homepage
            </a>

        </div>

    </main>

    <script src="register.js"></script>

</body>

</html>
```
