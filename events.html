<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Events</title>

    <link rel="stylesheet" href="events.css">
</head>

<body>

    <header>

        <div class="logo">
            <h1>STUDENTHUB</h1>
            <p>Student Academic Portal</p>
        </div>

        <button id="menubtn">☰</button>

        <nav id="navmenu">
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="dashboard.html">Features</a>
            <a href="events.html" class="active">Events</a>
            <a href="index.html#contact">Contact</a>
            <a href="login.html" class="login-link">Login</a>
        </nav>

    </header>

    <main>

        <section class="events-section">

            <h2>College Events</h2>

            <p>Search and explore upcoming events organized by different departments.</p>

            <div class="event-controls">

                <input
                    type="text"
                    id="search"
                    placeholder="Search events..."
                >

                <select id="department">
                    <option value="all">All Departments</option>
                    <option value="CSE">Computer Science</option>
                    <option value="ECE">Electronics & Communication</option>
                    <option value="ME">Mechanical Engineering</option>
                    <option value="CE">Civil Engineering</option>
                    <option value="IT">Information Technology</option>
                </select>

            </div>

            <div id="eventlist"></div>

        </section>

    </main>

    <footer>

        <p>
            © 2026 StudentHub Portal. All Rights Reserved.
        </p>

    </footer>

    <script src="events.js"></script>

</body>

</html>
