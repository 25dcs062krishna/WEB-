    <!DOCTYPE html>
    <html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>StudentHub - Login</title>

        <link rel="stylesheet" href="login.css">

    </head>

    <body>

        <header>

            <h1>STUDENTHUB PORTAL</h1>

            <p>Student Login</p>

        </header>


        <main>

            <section class="login-box">

                <div class="login-heading">

                    <div class="login-icon">
                        🎓
                    </div>

                    <h2>Student Login</h2>

                    <p>
                        Login to access your StudentHub account
                    </p>

                </div>



                <form>

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div class="forgot-password">

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <a href="dashboard.html" class="login-btn">
                        LOGIN
                    </a>

                </form>

                <p class="register-text">

                    Don't have an account?

                    <a href="register.html">
                        Register
                    </a>

                </p>

                <div class="back-home">

                    <a href="index.html">
                        ← Back to Homepage
                    </a>

                </div>

            </section>

        </main>


        <footer>

            <p>
                © 2026 StudentHub Portal. All Rights Reserved.
            </p>

        </footer>

    </body>

    </html>
