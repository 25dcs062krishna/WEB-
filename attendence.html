<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Attendance</title>
    <link rel="stylesheet" href="attendence.css">
</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <div class="logo">
                <h2>STUDENTHUB</h2>
                <p>Student Portal</p>
            </div>

            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="assignment.html">Assignments</a>
                <a href="attendence.html" class="active">Attendance</a>
                <a href="grades.html">Grades</a>
                <a href="profile.html">Profile</a>
            </nav>

            <div class="sidebar-bottom">
                <a href="index.html">Logout</a>
            </div>

        </aside>

        <main class="main-content">

            <div class="topbar">

                <div>
                    <h1>Attendance Report</h1>
                    <p>View your subject-wise attendance</p>
                </div>

                <div class="student-info">

                    <div>
                        <strong>Student</strong>
                        <span>CSE Student</span>
                    </div>

                    <div class="student-avatar">
                        S
                    </div>

                </div>

            </div>

            <section class="attendance-section">

                <h2>Subject Attendance</h2>

                <div class="attendance-card">

                    <table>

                        <thead>
                            <tr>
                                <th>Subject</th>
                                <th>Attendance</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr>
                                <td>Java</td>
                                <td>90%</td>
                            </tr>

                            <tr>
                                <td>Web Development</td>
                                <td>82%</td>
                            </tr>

                            <tr>
                                <td>Discrete Maths</td>
                                <td>95%</td>
                            </tr>

                            <tr>
                                <td>DSA</td>
                                <td>88%</td>
                            </tr>

                            <tr>
                                <td>FCN</td>
                                <td>75%</td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

            <div class="back-section">
                <a href="dashboard.html">← Back to Dashboard</a>
            </div>

        </main>

    </div>

</body>

</html>
